name: Build Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The ubuntu runner already ships the Android SDK; just make sure the API 36 pieces + licences are present.
      - name: Prepare Android SDK
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Sync into Android project
        run: npx cap sync android

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
        env:
          FORMA_KEYSTORE: ${{ secrets.FORMA_KEYSTORE_PATH }}
          FORMA_KEYSTORE_PASSWORD: ${{ secrets.FORMA_KEYSTORE_PASSWORD }}
          FORMA_KEY_ALIAS: ${{ secrets.FORMA_KEY_ALIAS }}
          FORMA_KEY_PASSWORD: ${{ secrets.FORMA_KEY_PASSWORD }}

      - name: Name and verify the APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Forma.apk
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs out/Forma.apk | head -5
          "$ANDROID_HOME"/build-tools/36.0.0/aapt2 dump badging out/Forma.apk | head -3
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Forma-apk
          path: out/Forma.apk
          retention-days: 30

      - name: Publish rolling "latest-apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --cleanup-tag --yes || true
          gh release create latest-apk out/Forma.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Forma APK (build ${{ github.run_number }})" \
            --notes "Sideloadable build of branch \`${{ github.ref_name }}\` at ${GITHUB_SHA::7}. Download Forma.apk on your phone and install it (allow 'install unknown apps' for your browser)."
